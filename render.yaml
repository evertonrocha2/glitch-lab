# Render blueprint: the backend API. The site itself is on Vercel, which forwards /api/* here
# (vercel.json), and the daily content cron runs on GitHub Actions (.github/workflows/daily-cron.yml).
# Secrets marked sync: false are asked for when the blueprint is created; generateValue ones are
# created by Render once.
services:
  - type: web
    name: glitch-lab-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # OpenRouter first, Gemini when it fails (no credits, outage): see server/infra/ai/index.js.
      - key: AI_PROVIDER
        value: openrouter,gemini
      - key: OPENROUTER_MODEL
        value: anthropic/claude-haiku-5.5
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: AUTH_SECRET
        generateValue: true
      - key: GLITCHDLE_SECRET
        generateValue: true
      # The same value as the GitHub secret CRON_SECRET, so only the daily workflow can run the cron.
      - key: CRON_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
