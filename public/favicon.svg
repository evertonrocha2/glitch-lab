<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Glitch Lab: the pixel magnifier with a bug in the lens, on a bordered tile with the hard purple shadow. -->
  <rect x="1" y="1" width="15" height="15" fill="#6a3df0"/>
  <rect x="0" y="0" width="15" height="15" fill="#1c1d26"/>
  <rect x="1" y="1" width="13" height="13" fill="#ffffff"/>
  <g fill="#1c1d26">
    <rect x="4" y="1" width="4" height="1"/>
    <rect x="3" y="2" width="1" height="1"/>
    <rect x="8" y="2" width="1" height="1"/>
    <rect x="2" y="3" width="1" height="4"/>
    <rect x="9" y="3" width="1" height="4"/>
    <rect x="3" y="7" width="1" height="1"/>
    <rect x="8" y="7" width="1" height="1"/>
    <rect x="4" y="8" width="4" height="1"/>
    <rect x="9" y="9" width="2" height="2"/>
    <rect x="11" y="11" width="2" height="2"/>
  </g>
  <g fill="#6a3df0">
    <rect x="4" y="4" width="1" height="1"/>
    <rect x="6" y="4" width="1" height="1"/>
    <rect x="5" y="5" width="1" height="1"/>
    <rect x="7" y="5" width="1" height="1"/>
  </g>
</svg>
