# The daily content cron for hosts without one (Render): new puzzles, Glitchdle and line hunt at
# 03:00 UTC, midnight in Brasilia. Needs repo secrets APP_URL (no trailing slash) and CRON_SECRET.
name: daily-cron
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run the daily cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL or CRON_SECRET not set, skipping"; exit 0; fi
          # A sleeping free instance can take a minute to wake, so wake it first.
          curl -fsS --retry 5 --retry-delay 15 --max-time 90 "$APP_URL/healthz"
          curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/challenge?cron=1"
